[project]
name = "egress-grind"
version = "0.1.0"
description = "Fail-closed egress gateway for LLM calls: stops or pseudonymises Swedish personal data before it reaches a cloud model. OpenAI-compatible."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "svenska-pii @ git+https://github.com/farrebutterfly-rgb/svenska-pii",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/egress_grind"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
